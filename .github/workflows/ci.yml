name: Web PR validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  web-checks:
    name: web-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: python3 -m py_compile scripts/github-setup.py
      - run: python3 -m unittest discover -s tests -p test_github_setup.py
      - name: Use repository-pinned npm
        run: |
          mawid_npm_version=$(node -p 'require("./package.json").engines.npm')
          if [ "$(npm --version)" != "$mawid_npm_version" ]; then
            npm install --global "npm@$mawid_npm_version"
          fi
          test "$(npm --version)" = "$mawid_npm_version"
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:pages
      - run: npm run verify:pages
      - run: npm run verify:toolchain
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      # The connected suite starts its own digest-pinned loopback PostgreSQL fixture.
      - name: Check Docker engine for connected booking clients
        run: docker info --format '{{.ServerVersion}}'
      - run: npm run test:booking-clients

  data-checks:
    name: data-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use repository-pinned npm
        run: |
          mawid_npm_version=$(node -p 'require("./package.json").engines.npm')
          if [ "$(npm --version)" != "$mawid_npm_version" ]; then
            npm install --global "npm@$mawid_npm_version"
          fi
          test "$(npm --version)" = "$mawid_npm_version"
      - run: npm ci
      - run: npm run test:data-csv
      - run: npm run test:data-api
      - run: npm run test:data-auth
      - run: npm run test:identity
      - run: npm run test:identity-email
      - run: npm run test:booking
      - run: npm run test:visit-migration
      - run: npm run test:visits
      - run: npm run test:reviews
      - run: npm run test:meeting-policy
      - run: npm run test:notifications
      - run: npm run test:data-maintenance
      - run: npm run test:data-migrations
      - name: Start isolated schema fixture
        run: docker run --detach --name mawid-issue6-local-20261114 --network none --env POSTGRES_HOST_AUTH_METHOD=trust postgres:17.12-bookworm@sha256:40865bc877a289da75963d97d72b59633f639fc5af7a4e856bfa3714cae5b536
      - name: Wait for isolated schema fixture
        run: |
          for attempt in {1..30}; do
            if docker exec mawid-issue6-local-20261114 pg_isready --host=127.0.0.1 --username=postgres --dbname=postgres; then
              exit 0
            fi
            sleep 1
          done
          docker logs mawid-issue6-local-20261114
          exit 1
      - run: npm run test:data-db
      - name: Remove isolated schema fixture
        if: always()
        run: docker rm --force --volumes mawid-issue6-local-20261114 || true
      - name: Upload fictional-data verification metadata
        uses: actions/upload-artifact@v4
        with:
          name: fictional-data-verification
          path: database/*verification.json
